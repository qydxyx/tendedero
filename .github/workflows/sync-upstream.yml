name: Sync upstream

on:
  schedule:
    # Check twice a day (02:00 and 14:00 UTC) on ubuntu-latest; macOS only runs when upstream publishes a new app release.
    - cron: "0 2,14 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to sync (leave empty for latest release)"
        required: false
        default: ""
      force:
        description: "Re-sync and rebuild even if this release already exists in our releases"
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.check.outputs.should_sync }}
      tag: ${{ steps.check.outputs.tag }}
      release_name: ${{ steps.check.outputs.release_name }}
      release_url: ${{ steps.check.outputs.release_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: alejandrobujan/tendedero
    steps:
      - name: Check upstream latest release
        id: check
        run: |
          set -euo pipefail
          INPUT_TAG="${{ inputs.tag }}"
          FORCE="${{ inputs.force }}"

          if [ -n "$INPUT_TAG" ]; then
            RELEASE_JSON="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${INPUT_TAG}")"
          else
            RELEASE_JSON="$(gh api "repos/${UPSTREAM_REPO}/releases/latest")"
          fi

          TAG="$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')"
          RELEASE_NAME="$(printf '%s' "$RELEASE_JSON" | jq -r '.name // .tag_name')"
          RELEASE_URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.html_url')"
          HAS_APP="$(printf '%s' "$RELEASE_JSON" | jq -r '[.assets[].name | ascii_downcase | select(endswith(".dmg") or endswith(".zip") or endswith(".pkg"))] | length > 0')"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

          if [ "$HAS_APP" != "true" ]; then
            echo "Upstream release ${TAG} has no installable app asset (.dmg/.zip/.pkg) yet; skipping."
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FORCE" != "true" ] && gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists in ${GITHUB_REPOSITORY}; skipping."
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New upstream app release detected: ${TAG} (${RELEASE_NAME})"
          echo "should_sync=true" >> "$GITHUB_OUTPUT"

  sync:
    needs: check
    if: needs.check.outputs.should_sync == 'true'
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UPSTREAM: https://github.com/alejandrobujan/tendedero.git
      UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
      UPSTREAM_RELEASE_NAME: ${{ needs.check.outputs.release_name }}
      UPSTREAM_RELEASE_URL: ${{ needs.check.outputs.release_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream release tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch --no-tags origin
          git fetch --no-tags --force upstream "refs/tags/${UPSTREAM_TAG}:refs/tags/upstream-${UPSTREAM_TAG}"
          UPSTREAM_SHA="$(git rev-parse "refs/tags/upstream-${UPSTREAM_TAG}^{commit}")"
          UPSTREAM_SHORT="$(git rev-parse --short "$UPSTREAM_SHA")"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHORT=$UPSTREAM_SHORT" >> "$GITHUB_ENV"
          echo "DEFAULT_BRANCH=${{ github.event.repository.default_branch }}" >> "$GITHUB_ENV"

      - name: Apply overlays onto upstream release
        id: apply
        run: |
          set -euo pipefail
          BRANCH="sync/upstream-${UPSTREAM_TAG}"
          BASE_SHA="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          BASE_TREE="$(git rev-parse "origin/${DEFAULT_BRANCH}^{tree}")"

          git checkout --detach "$UPSTREAM_SHA"
          rm -rf .github/workflows
          git checkout "origin/${DEFAULT_BRANCH}" -- overlays .github/workflows .gitignore
          mkdir -p /tmp
          if python3 overlays/apply-all.py > /tmp/overlay-apply.log 2>&1; then
            echo "apply_ok=true" >> "$GITHUB_OUTPUT"
            cat /tmp/overlay-apply.log
          else
            echo "apply_ok=false" >> "$GITHUB_OUTPUT"
            cat /tmp/overlay-apply.log
          fi
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
          find . -name '*.pyc' -delete
          git add -A
          TREE="$(git write-tree)"
          if [ "$TREE" = "$BASE_TREE" ]; then
            echo "Tree already matches origin/${DEFAULT_BRANCH}; no new commit needed."
            git checkout -B "$BRANCH" "$BASE_SHA"
          else
            COMMIT_MSG="$(cat <<EOF
          Apply overlays onto ${UPSTREAM_TAG} (${UPSTREAM_SHA})

          Upstream: alejandrobujan/tendedero@${UPSTREAM_SHORT} (${UPSTREAM_TAG})
          EOF
          )"
            if git merge-base --is-ancestor "$UPSTREAM_SHA" "$BASE_SHA"; then
              SYNC_COMMIT="$(git commit-tree "$TREE" -p "$BASE_SHA" -m "$COMMIT_MSG")"
            else
              SYNC_COMMIT="$(git commit-tree "$TREE" -p "$BASE_SHA" -p "$UPSTREAM_SHA" -m "$COMMIT_MSG")"
            fi
            git checkout -B "$BRANCH" "$SYNC_COMMIT"
          fi
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Build app and DMG
        if: steps.apply.outputs.apply_ok == 'true'
        run: |
          set -euo pipefail
          bash scripts/make-dmg.sh
          ASSET_DIR="${RUNNER_TEMP}/release-assets"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          cp build/*.dmg "$ASSET_DIR/"
          ls -lh "$ASSET_DIR"

      - name: Publish onto main
        id: publish
        if: steps.apply.outputs.apply_ok == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet "origin/${DEFAULT_BRANCH}"; then
            echo "Already up to date with upstream ${UPSTREAM_TAG}."
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "target_sha=$(git rev-parse "origin/${DEFAULT_BRANCH}")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          git push -u origin "HEAD:${BRANCH}" --force
          BODY="$(cat <<EOF
          ## What and why

          Replay local overlays onto upstream release [${UPSTREAM_TAG}](${UPSTREAM_RELEASE_URL}) ([alejandrobujan/tendedero@${UPSTREAM_SHORT}](https://github.com/alejandrobujan/tendedero/commit/${UPSTREAM_SHA})).

          Overlays: menu-bar-swipe, space-join, local-build.

          ## How you tested it

          \`scripts/make-dmg.sh\` on the GitHub-hosted macOS runner.
          EOF
          )"

          PR_NUMBER="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            if gh pr create --repo "${GITHUB_REPOSITORY}" --base "${DEFAULT_BRANCH}" --head "${BRANCH}" \
                --title "Sync upstream ${UPSTREAM_TAG}" --body "$BODY"; then
              PR_NUMBER="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
            else
              echo "Cannot open a pull request; pushing ${BRANCH} directly onto ${DEFAULT_BRANCH}."
              git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
              git push origin --delete "${BRANCH}" || true
              git fetch --no-tags origin "${DEFAULT_BRANCH}"
              echo "merged=true" >> "$GITHUB_OUTPUT"
              echo "target_sha=$(git rev-parse "origin/${DEFAULT_BRANCH}")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "Pull request #${PR_NUMBER} for ${BRANCH} already exists."
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Could not determine pull request number for ${BRANCH}."
            exit 1
          fi

          for i in $(seq 1 12); do
            PR_STATE="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefOid,mergeable --jq '[.headRefOid, .mergeable] | join(" ")')"
            PR_HEAD="${PR_STATE%% *}"
            PR_MERGEABLE="${PR_STATE#* }"
            echo "PR #${PR_NUMBER} check ${i}: head=${PR_HEAD} mergeable=${PR_MERGEABLE}"
            if [ "$PR_HEAD" = "$HEAD_SHA" ] && [ "$PR_MERGEABLE" = "MERGEABLE" ]; then
              break
            fi
            sleep 3
          done

          MERGED=false
          for attempt in 1 2 3; do
            if gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --merge --delete-branch; then
              MERGED=true
              break
            fi
            echo "Merge attempt ${attempt} failed; retrying in 5s..."
            sleep 5
          done

          if [ "$MERGED" != "true" ]; then
            echo "::error::Failed to merge PR #${PR_NUMBER} onto ${DEFAULT_BRANCH}."
            exit 1
          fi

          git fetch --no-tags origin "${DEFAULT_BRANCH}"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse "origin/${DEFAULT_BRANCH}")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.apply.outputs.apply_ok == 'true' && steps.publish.outputs.merged == 'true'
        run: |
          set -euo pipefail
          TARGET_SHA="${{ steps.publish.outputs.target_sha }}"
          TITLE="${UPSTREAM_RELEASE_NAME} (with local overlays)"
          NOTES="$(cat <<EOF
          Based on upstream release [${UPSTREAM_TAG}](${UPSTREAM_RELEASE_URL}) (\`${UPSTREAM_SHORT}\`).

          Included overlays:
          - \`menu-bar-swipe\`: Two-finger swipe down/up in the menu bar to show and hide the line
          - \`space-join\`: \`canJoinAllApplications\` so the line stays on the active Space
          - \`local-build\`: \`--build-system native\` for SwiftPM builds

          > Note: Built and signed ad-hoc on GitHub Actions. If macOS Gatekeeper blocks opening, right-click → Open or run \`xattr -cr /Applications/Tendedero.app\`.
          EOF
          )"

          git tag -f "${UPSTREAM_TAG}" "${TARGET_SHA}"
          git push origin "refs/tags/${UPSTREAM_TAG}" --force

          if gh release view "${UPSTREAM_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${UPSTREAM_TAG}" "${RUNNER_TEMP}/release-assets/"*.dmg --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${UPSTREAM_TAG}" --repo "${GITHUB_REPOSITORY}" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "${UPSTREAM_TAG}" "${RUNNER_TEMP}/release-assets/"*.dmg \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Report a failed apply
        if: steps.apply.outputs.apply_ok != 'true'
        run: |
          set -euo pipefail
          git push -u origin "HEAD:${BRANCH}" --force || true
          TITLE="Upstream overlay apply failed on ${UPSTREAM_TAG} (${UPSTREAM_SHORT})"
          BODY="$(cat <<EOF
          Applying overlays onto upstream release [${UPSTREAM_TAG}](${UPSTREAM_RELEASE_URL}) (alejandrobujan/tendedero@${UPSTREAM_SHA}) failed.

          A hook in \`overlays/*/apply.py\` no longer matches upstream. Update the overlay and re-run **Sync upstream**.

          \`\`\`
          $(tail -c 4000 /tmp/overlay-apply.log 2>/dev/null || echo "(no apply log)")
          \`\`\`
          EOF
          )"
          gh issue list --repo "${GITHUB_REPOSITORY}" --search "$TITLE in:title" --json number --jq '.[0].number' | grep -q . || \
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "$TITLE" --body "$BODY"
          exit 1
